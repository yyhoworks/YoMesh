[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yomesh"
version = "0.15.1"
description = "Shared proxy policy compiler for Mihomo, sing-box and MosDNS"
requires-python = ">=3.11"
dependencies = ["PyYAML==6.0.3"]

[project.scripts]
yomesh = "yomesh.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
