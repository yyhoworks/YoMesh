name: Native core compatibility
on: [push, pull_request, workflow_dispatch]
jobs:
  windows-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Fetch pinned cores and verify SHA256
        shell: pwsh
        run: ./scripts/bootstrap-cores.ps1
      - name: Install subscription parser
        run: python -m pip install -r requirements.txt
      - name: Compile and exercise real local cores
        run: python -m unittest discover -s tests -v
      - name: Verify frontend credential and rendering regressions
        run: node --test tests/frontend-security.cjs
